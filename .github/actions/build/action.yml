# The app's checks and release build, shared by unstable.yml and release.yml so the two cannot
# drift: format, lints, the Rust tests and the C++ build (with its widget tests). Leaves
# out/release/app holding the product. The harness scripts are not run here: 50 of them take far
# longer than the rest of the pipeline and one stalled a run for over an hour. Run them locally
# (`pwsh tools/run-harness-scripts.ps1`) before a release.
#
# The frozen C# app lives in its own repository (bertbrowser-csharp-archive) and is never built here.
name: Build and check the app
description: fmt, clippy, cargo test, cmake release build

inputs:
  version:
    description: SemVer to stamp into the build once the tests have passed; empty keeps the committed one.
    default: ''

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - uses: Swatinem/rust-cache@v2

    # Prebuilt binaries rather than compiling them on every run.
    - uses: taiki-e/install-action@v2
      with:
        tool: cbindgen,cargo-hakari

    - name: Format
      shell: pwsh
      run: cargo fmt --all --check

    # Every cargo invocation (the product, the harness, the tests) must resolve third-party crates
    # with one feature set, or bb-core and everything above it compiles once per set. The
    # bb-workspace-hack crate holds that set; this fails when a Cargo.toml change leaves it stale.
    # Fix locally with `cargo hakari generate` and `cargo hakari manage-deps`.
    - name: Workspace-hack is current
      shell: pwsh
      run: |
        cargo hakari generate --diff
        if ($LASTEXITCODE) { exit 1 }
        cargo hakari manage-deps --dry-run
        if ($LASTEXITCODE) { exit 1 }

    - name: Clippy
      shell: pwsh
      run: cargo clippy --workspace --all-targets -- -D warnings

    # Release, so it shares its artifacts with the cmake build below, which compiles the same profile
    # (and, through bb-workspace-hack, the same features).
    - name: Test
      shell: pwsh
      run: cargo test --workspace --release

    # After the tests, which pin the committed major version. Exports BB_VERSION to the steps below,
    # which only bb-ffi reads, so the release build reuses everything the tests compiled.
    - name: Stamp the version
      if: inputs.version != ''
      shell: pwsh
      run: pwsh tools/set-version.ps1 -Version '${{ inputs.version }}'

    # The MSVC environment only from here on: the cargo steps above run without it, as cargo inside
    # the cmake build does (CMakeLists.txt, BB_CARGO_ENV). A C build script reruns when INCLUDE/LIB
    # differ from its last run, and bb-core and everything above it would compile a second time.
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - uses: seanmiddleditch/gha-setup-ninja@v5

    - name: Configure
      shell: pwsh
      run: cmake --preset release

    # Also runs the C++ widget tests (bbapp_tests is a post-build step of its own target).
    - name: Build
      shell: pwsh
      run: cmake --build --preset release
