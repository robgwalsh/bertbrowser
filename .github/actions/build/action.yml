# The app's checks and release build, shared by unstable.yml and release.yml so the two cannot
# drift: format, lints, the Rust tests, the C++ build, then every non-bench tools/ui script through the
# offscreen harness (WARP, no GPU, no focus). Leaves out/release/app holding the product.
#
# The frozen C# app lives in its own repository (bertbrowser-csharp-archive) and is never built here.
name: Build and check the app
description: fmt, clippy, cargo test, cmake release build, the harness scripts

inputs:
  version:
    description: SemVer to stamp into the build once the tests have passed; empty keeps the committed one.
    default: ''

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - uses: Swatinem/rust-cache@v2

    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - uses: seanmiddleditch/gha-setup-ninja@v5

    - name: Install cbindgen
      shell: pwsh
      run: cargo install cbindgen --locked

    - name: Format
      shell: pwsh
      run: cargo fmt --all --check

    - name: Clippy
      shell: pwsh
      run: cargo clippy --workspace --all-targets -- -D warnings

    # Release, so it shares its artifacts with the cmake build below, which compiles the same profile.
    - name: Test
      shell: pwsh
      run: cargo test --workspace --release

    # After the tests, which pin the committed major version. Cargo.lock follows on the next build, so
    # nothing below uses --locked.
    - name: Stamp the version
      if: inputs.version != ''
      shell: pwsh
      run: pwsh tools/set-version.ps1 -Version '${{ inputs.version }}'

    - name: Configure
      shell: pwsh
      run: cmake --preset release

    # Also runs the C++ widget tests (bbapp_tests is a post-build step of its own target).
    - name: Build
      shell: pwsh
      run: cmake --build --preset release

    # One fresh --out per script, tree.bbs and index-degraded.bbs with their own flags: see the script.
    - name: Harness scripts
      shell: pwsh
      run: pwsh tools/run-harness-scripts.ps1 -Out out/harness-run

    - name: Harness captures (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: harness-captures-${{ github.run_number }}
        path: out/harness-run/
        if-no-files-found: ignore
