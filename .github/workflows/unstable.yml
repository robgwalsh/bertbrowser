# Publishes the latest code in main as the "unstable" channel: same build and same checks as a
# release, packed on a separate Velopack channel and published as a rolling GitHub pre-release.
#
# It cannot disturb a release. Different tag, different channel, different feed file - an installed
# release copy looks for releases.win.json and never sees releases.unstable.json, and GitHub's
# "latest" excludes pre-releases, so the README's stable download links skip this entirely.
#
# Pull requests run the same checks and build, and stop before anything is packed or published.
name: Unstable

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Pushes queue rather than cancel. Cancelling a run mid-upload strands a *draft* release holding the
# `unstable` tag, and a draft has no tag as far as `gh release delete` is concerned - while vpk's own
# collision check does see it, and refuses to publish. Every run after that would fail until someone
# cleared it by hand. A superseded build costs a few minutes; a wedged channel costs a repair.
# Pull requests publish nothing, so they get a group of their own and may be superseded freely.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('unstable-pr-{0}', github.ref) || 'unstable' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unstable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # tags, so the last released version can be found

      # The next patch after the last release, plus the run number: 1.1.2 -> 1.1.3-unstable.42.
      # SemVer compares dot-separated numeric identifiers numerically, so .10 is above .7 - which a
      # bare "-unstable42" would not be - and the whole thing sorts below the 1.1.3 it anticipates.
      - name: Derive version
        id: ver
        shell: bash
        run: |
          # 'v[0-9]*' rather than 'v*', so only version tags can ever match - anything else would
          # poison the -v:refname sort and silently change the base version.
          latest=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"
          version="$major.$minor.$((patch + 1))-unstable.${{ github.run_number }}"
          echo "Latest release tag ${latest}; building ${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # fmt, clippy, cargo test, the cmake release build and the harness scripts. The version is
      # stamped into the tree after the tests, so the About box reports this build.
      - uses: ./.github/actions/build
        with:
          version: ${{ steps.ver.outputs.version }}

      # Deltas matter more here than on a release: an unstable copy takes an update on every push, so
      # it is a few MB each time instead of a full package. The delta is built here, against the
      # package downloaded from the release that is still up - the replacement below happens
      # afterwards and has no bearing on it, and a client applies the delta against its own local
      # package anyway.
      #
      # --pre is required: the only release carrying releases.unstable.json is a pre-release, so
      # without it the download finds nothing and the delta silently comes out full-sized.
      #
      # The pack id stays BertBrowser, so an installed C# copy takes this build as its next update.
      - name: Pack
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          dotnet tool install -g vpk
          pwsh tools/stage-package.ps1 -Out out/release/pack
          # Absent on the first run, and during another run's upload window. vpk logs it and exits 0;
          # a full-only package is a correct release, just a fat one.
          vpk download github --repoUrl https://github.com/${{ github.repository }} `
            --token ${{ secrets.GITHUB_TOKEN }} --channel unstable --pre
          vpk pack --packId BertBrowser --packVersion ${{ steps.ver.outputs.version }} `
            --packDir out/release/pack --mainExe BertBrowser.exe --packTitle BertBrowser `
            --packAuthors "Rob Walsh" --icon src/app/app/app.ico `
            --channel unstable
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # One rolling pre-release, so the README can link to it without the URL rotting - there is no
      # "latest pre-release" download form. It is replaced rather than merged into: vpk refuses to
      # add a second releases.unstable.json to a release that already has one, and GitHub ignores
      # target_commitish for a tag that already exists, so the tag goes with it.
      #
      # Everything above this point can fail without touching what is published. Do not reorder -
      # a pack that failed after the delete would leave no unstable release at all.
      - name: Clear the previous rolling release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # By id rather than by tag, so a draft stranded by an interrupted run is cleared too - a
          # draft holds the tag against vpk but is invisible to `gh release delete unstable`.
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                        --jq '.[] | select(.tag_name == "unstable") | .id'); do
            echo "Deleting release $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          # The tag has to go with it, or GitHub keeps the old commitish when the release is recreated.
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/unstable" \
            || echo "No unstable tag to remove."

      # The release name is the bare version, because it is what the README's badge displays.
      - name: Publish the rolling unstable release
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          vpk upload github --repoUrl https://github.com/${{ github.repository }} `
            --token ${{ secrets.GITHUB_TOKEN }} --publish --pre --channel unstable `
            --releaseName "${{ steps.ver.outputs.version }}" `
            --tag unstable --targetCommitish ${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # The bb-core micro-benchmarks (src/crates/bb-bench, Tier A), gated on allocations only. A shared
  # runner's wall clock is noise and is reported in the job summary, never judged; the bytes a
  # benchmark allocates are deterministic and a regression there fails this job.
  #
  # A separate job beside the build on purpose: an allocation regression turns the run red without
  # withholding the unstable build, and a broken benchmark can never block shipping. Tiers B and C
  # (the UI harness and the real executable) stay local - no GPU, and a timing on a shared runner
  # means nothing. See bench/README.md for the baseline's lifecycle.
  #
  # bench/baselines/ci-windows-latest.json is recorded by CI itself (a baseline from another
  # machine counts allocations differently). Until one is committed, `compare --ci` writes a candidate
  # next to the results and passes, so the first run uploads the file to commit.
  bench:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the bench driver
        shell: pwsh
        run: cargo build -p bb-bench --release

      - name: Benchmarks (Tier A, short job)
        shell: pwsh
        run: >
          .\target\release\bb-bench.exe run --ci --scale 1
          --machine-key ci-windows-latest --out bench-results/current.json

      - name: Compare allocations against the committed baseline
        shell: pwsh
        run: >
          .\target\release\bb-bench.exe compare --ci
          --baseline bench/baselines/ci-windows-latest.json --current bench-results/current.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results-${{ github.run_number }}
          path: bench-results/
