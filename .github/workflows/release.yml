name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # fmt, clippy, cargo test, the cmake release build and every non-bench harness script. The
      # version is stamped into the tree after the tests, so the About box reports the tag.
      # The frozen C# app lives in its own repository and is not built here.
      - uses: ./.github/actions/build
        with:
          version: ${{ steps.ver.outputs.version }}

      - name: Pack and upload Velopack release
        shell: pwsh
        run: |
          dotnet tool install -g vpk
          # BertBrowser.exe and the two elevated helpers beside it, nothing else: vpk packs the whole folder.
          pwsh tools/stage-package.ps1 -Out out/release/pack
          # Fetch the previous release (if any) so vpk can build a delta package.
          # Fails on the very first release when the repo has none - that's fine.
          vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
          if ($LASTEXITCODE -ne 0) { Write-Host "No previous release found; building full package only." }
          # The pack id stays BertBrowser, so an installed C# copy takes this build as its next update.
          vpk pack --packId BertBrowser --packVersion ${{ steps.ver.outputs.version }} `
            --packDir out/release/pack --mainExe BertBrowser.exe --packTitle BertBrowser `
            --packAuthors "Rob Walsh" --icon src/app/app/app.ico
          if ($LASTEXITCODE -ne 0) { exit 1 }
          vpk upload github --repoUrl https://github.com/${{ github.repository }} `
            --token ${{ secrets.GITHUB_TOKEN }} --publish `
            --releaseName "BertBrowser ${{ steps.ver.outputs.version }}" `
            --tag ${{ github.ref_name }}
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # Opens a pull request at microsoft/winget-pkgs for the release the job above published.
  # It builds the new manifest from the newest one already upstream, so whatever is published
  # there is the template for every version after it - a wrong installer type or a stale URL
  # propagates rather than being corrected. See docs/build-and-release.md.
  # Needs a classic PAT with public_repo (secret WINGET_PAT) and a winget-pkgs fork on the account.
  # A failure here does not affect the release itself; it can be re-run, or submitted by hand.
  winget:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: RobWalsh.BertBrowser
          installers-regex: 'Setup\.exe$'
          release-tag: ${{ github.ref_name }}
          release-notes-url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          token: ${{ secrets.WINGET_PAT }}
