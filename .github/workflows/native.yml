name: Native

on:
  push:
    branches: [main]
    paths: ["native/**", ".github/workflows/native.yml"]
  pull_request:
    paths: ["native/**", ".github/workflows/native.yml"]
  workflow_dispatch:

jobs:
  native:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Install cbindgen
        run: cargo install cbindgen --locked
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Spike S7 (FFI)
        run: .\out\release\spikes\s7_ffi.exe
      - name: Spike S4 (offscreen capture through WARP)
        run: .\out\release\spikes\s4_capture.exe s4.png
      - name: Spike S1 (DirectWrite edit control)
        run: .\out\release\spikes\s1_edit.exe s1.png
      - name: Spike S2 (IMFMediaEngine frames into a D3D11 texture)
        run: .\out\release\spikes\s2_media.exe
      - name: Spike S3 (shell context-menu handler in a private HMENU)
        run: .\out\release\spikes\s3_shellmenu.exe
      - name: Spike S8 (custom chrome: hit tests, clamp, DWM attributes)
        run: .\out\release\spikes\s8_chrome.exe
      - name: Spike S5 (pause inside CopyFileExW)
        run: cargo run -p bb-spikes --bin s5_copy_pause --release
      - uses: actions/upload-artifact@v4
        with:
          name: spike-captures
          path: native/*.png
