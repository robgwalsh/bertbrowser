# Static CRT on the Rust side. The C++ side is built /MT (CMAKE_MSVC_RUNTIME_LIBRARY), and the two must
# match or the staticlib link produces duplicate CRT symbols and heap-crossing bugs. This also removes
# the VC redistributable from Setup.exe.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
# LLD (shipped with the Rust toolchain) rather than MSVC's link.exe for every Rust executable: the test
# binaries, bb-indexer, bb-elevator, bb-bench. Several times faster on a large link with debug info.
# The staticlibs C++ links are not linked by rustc, so this does not touch them.
linker = "rust-lld.exe"
