[package]
name = "bb-indexer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bb-paths = { path = "../bb-paths" }
bb-core = { path = "../bb-core" }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
] }
# The Task Scheduler is COM; the typed interfaces beat hand-declared vtables, where a wrong slot is
# not a compile error but a call through the wrong function pointer.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_TaskScheduler",
    "Win32_System_Variant",
] }

[build-dependencies]
embed-manifest.workspace = true
