[package]
name = "bb-commands"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Split out of bb-core: the command catalogue, keymap, palette and the menu bar/toolbars. Tests live in tests/all (one binary), never in src: see bb-core's Cargo.toml.
test = false
doctest = false

[dependencies]
bb-base = { path = "../bb-base" }
bb-core = { path = "../bb-core" }
bb-integration = { path = "../bb-integration" }
bb-paths = { path = "../bb-paths" }
serde.workspace = true
bb-workspace-hack = { version = "0.1", path = "../bb-workspace-hack" }

[dev-dependencies]
serde_json.workspace = true
