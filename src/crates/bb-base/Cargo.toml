[package]
name = "bb-base"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Tests live in bb-core's tests/all (through its re-exports), never in src: see bb-core's Cargo.toml.
test = false
doctest = false

[dependencies]
bb-paths = { path = "../bb-paths" }
serde.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
] }
bb-workspace-hack = { version = "0.1", path = "../bb-workspace-hack" }
