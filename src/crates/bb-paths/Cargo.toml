[package]
name = "bb-paths"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples: without this, `cargo test` runs a rustdoc pass over the crate that finds nothing.
doctest = false

[dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_UI_Shell"] }
bb-workspace-hack = { version = "0.1", path = "../bb-workspace-hack" }

[dev-dependencies]
