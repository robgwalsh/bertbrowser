[package]
name = "bb-test-support"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No in-crate tests (they live in tests/) and no doc examples: without these, `cargo test` compiles
# the whole crate a second time as its own test binary, and runs a rustdoc pass that finds nothing.
test = false
doctest = false

[dependencies]
bb-archive-fixtures = { path = "../bb-archive-fixtures" }
bb-core = { path = "../bb-core" }
bb-elevation = { path = "../bb-elevation" }
bb-fixtures = { path = "../bb-fixtures" }
bb-paths = { path = "../bb-paths" }
base64.workspace = true
zip.workspace = true
bb-workspace-hack = { version = "0.1", path = "../bb-workspace-hack" }
