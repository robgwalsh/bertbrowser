[package]
name = "bb-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples: without this, `cargo test` runs a rustdoc pass over the crate that finds nothing.
doctest = false

[dependencies]
bb-core = { path = "../bb-core" }
bb-benchmarking = { path = "../bb-benchmarking" }
bb-integration = { path = "../bb-integration" }
bb-theming = { path = "../bb-theming" }
bb-commands = { path = "../bb-commands" }
bb-elevation = { path = "../bb-elevation" }
bb-settings = { path = "../bb-settings" }
bb-tools = { path = "../bb-tools" }
bb-undo = { path = "../bb-undo" }
bb-paths = { path = "../bb-paths" }
bb-shell = { path = "../bb-shell" }
serde.workspace = true
serde_json.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

# IShellLink: the shortcut writer.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
] }
bb-workspace-hack = { version = "0.1", path = "../bb-workspace-hack" }

[dev-dependencies]
bb-test-support = { path = "../bb-test-support" }
