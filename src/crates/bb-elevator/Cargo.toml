[package]
name = "bb-elevator"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "bb-elevator"
path = "src/main.rs"
# No tests in it: without this, `cargo test` builds and links an empty test binary for it.
test = false

[dependencies]
bb-paths = { path = "../bb-paths" }
bb-core = { path = "../bb-core" }
bb-elevation = { path = "../bb-elevation" }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
bb-workspace-hack = { version = "0.1", path = "../bb-workspace-hack" }

[build-dependencies]
embed-manifest.workspace = true
