[package]
name = "bb-archives"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Split out of bb-core: archives browsed as folders, and the compression crates with them. Tests
# live in tests/all (one binary), never in src: see bb-core's Cargo.toml.
test = false
doctest = false

[dependencies]
bb-base = { path = "../bb-base" }
bb-files = { path = "../bb-files" }
bb-paths = { path = "../bb-paths" }
bb-search = { path = "../bb-search" }
zip.workspace = true
sevenz-rust2.workspace = true
unrar.workspace = true
tar.workspace = true
flate2.workspace = true
bzip2.workspace = true
liblzma.workspace = true
ruzstd.workspace = true
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }
bb-workspace-hack = { version = "0.1", path = "../bb-workspace-hack" }

[dev-dependencies]
bb-file-fixtures = { path = "../bb-file-fixtures" }
bb-base = { path = "../bb-base" }
bb-fixtures = { path = "../bb-fixtures" }
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }
