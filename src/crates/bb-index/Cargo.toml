[package]
name = "bb-index"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Split out of bb-core: the index. Tests live in tests/all (one binary), never in src: see bb-core's
# Cargo.toml.
test = false
doctest = false

[dependencies]
bb-base = { path = "../bb-base" }
bb-paths = { path = "../bb-paths" }
bb-preview = { path = "../bb-preview" }
bb-search = { path = "../bb-search" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
windows-sys = { workspace = true, features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
bb-workspace-hack = { version = "0.1", path = "../bb-workspace-hack" }

[dev-dependencies]
bb-base = { path = "../bb-base" }
bb-test-support = { path = "../bb-test-support" }
serde_json.workspace = true
