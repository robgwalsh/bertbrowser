[package]
name = "bb-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples: without this, `cargo test` runs a rustdoc pass over the crate that finds nothing.
doctest = false

[dependencies]
bb-core = { path = "../bb-core" }
bb-benchmarking = { path = "../bb-benchmarking" }
bb-elevation = { path = "../bb-elevation" }
bb-integration = { path = "../bb-integration" }
serde_json.workspace = true
# Installer hooks and the update manager. The newest release that is not a git-describe build.
velopack = "1.2.161"
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Environment",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
bb-workspace-hack = { version = "0.1", path = "../bb-workspace-hack" }

[dev-dependencies]
bb-test-support = { path = "../bb-test-support" }
