# Generates include/bbcore.h from src/crates/bb-ffi. Run by the CMake target `cargo_build` and by
# build.ps1. The header is committed so IDEs can index the C++ tree before cargo has run.
language = "C"
include_guard = "BBCORE_H"
cpp_compat = true
style = "both"
sys_includes = ["stdint.h", "stdbool.h", "stddef.h"]
no_includes = true
usize_is_size_t = true
documentation = true
documentation_style = "c99"

[parse]
parse_deps = false
