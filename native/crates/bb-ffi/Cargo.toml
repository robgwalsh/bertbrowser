[package]
name = "bb-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "bbcore"
# The staticlib is what C++ links; the rlib lets the integration tests call the extern "C" functions.
crate-type = ["staticlib", "rlib"]

[dependencies]
bb-app = { path = "../bb-app" }
bb-core = { path = "../bb-core" }
serde_json.workspace = true
# The small real files the harness drops into a sandbox (`bb_fixture_write`). On by default so one
# staticlib serves the app and the harness; they are a few hundred kilobytes of base64.
bb-test-support = { path = "../bb-test-support", optional = true }

[features]
default = ["fixtures"]
fixtures = ["dep:bb-test-support"]
